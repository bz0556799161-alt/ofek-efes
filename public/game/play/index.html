<style id="gameStyle">
/* ============================== THEME ============================== */
:root{
  color-scheme:dark;
  --sky-0:#03060f; --sky-1:#071029; --sky-2:#0c1a3d;
  --ink:#e9edf7; --ink-soft:#a8b3cc; --ink-faint:#6f7b97;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color-scheme:dark;background:var(--sky-0);color:var(--ink);font-family:var(--sans);overflow:hidden;

#app{display:flex;flex-direction:column;height:100%;

/* ============================== HEADER ============================== */
header{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:10px 16px 8px;flex-wrap:wrap}
.title{font-family:var(--serif);font-size:clamp(19px,3vw,27px);font-weight:500;margin:0;white-space:nowrap}
.title span{color:var(--gold)}
.hright{display:flex;align-items:center;gap:12px;flex:1;justify-content:flex-end;min-width:220px}

.levelbox{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1;max-width:420px}
.levelline{font-size:13.5px;color:var(--ink-soft);line-height:1.35}
.levelline b{color:var(--ink);font-weight:600}
.progress{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff3c8);transition:width .6s ease}
.small{font-size:13px;padding:6px 12px;min-height:34px}
.icon{width:38px;height:38px;min-height:0;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon .off{display:none}
.icon[aria-pressed="false"]{color:var(--ink-faint)}
.icon[aria-pressed="false"] .off{display:inline}

#skywrap{position:relative;flex:1;min-height:0}
#sky{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
#world{transition:opacity .45s ease}
#sky.fading #world{opacity:0}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}
.flash{animation:flash .6s ease 2}
@keyframes flash{50%{opacity:.15}}
.ring{fill:none;stroke:var(--gold);opacity:.9;animation:ringIn .35s ease-out}
@keyframes ringIn{from{opacity:0;transform:scale(1.8)}to{opacity:.9;transform:scale(1)}}
.ring,.xmark,.pulse{transform-box:fill-box;transform-origin:center}
.pulse{fill:none;stroke:var(--gold);animation:pulse2 1.1s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.55);opacity:.35}}
.xmark{stroke:var(--err);stroke-linecap:round;fill:none;animation:xfade 1.4s ease forwards}
@keyframes xfade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.cline{fill:none;stroke:var(--line);stroke-linecap:round;opacity:.75}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hintline{fill:none;stroke:var(--line);stroke-linecap:round;animation:hintfade 2.2s ease forwards}
@keyframes hintfade{0%{opacity:0}15%{opacity:.85}75%{opacity:.85}100%{opacity:0}}
.region{fill:rgba(169,198,255,.06);stroke:rgba(169,198,255,.4);stroke-dasharray:4 6;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dragline{stroke:var(--gold);stroke-linecap:round;fill:none;opacity:.85}
.dragline.bad{stroke:var(--err);transition:opacity .9s ease;opacity:0}
.guide{fill:none;stroke:var(--gold);stroke-linecap:round;opacity:.9}
.tick{fill:var(--gold);opacity:0;animation:tickIn .3s ease forwards}
@keyframes tickIn{to{opacity:.9}}
.halo{fill:url(#haloGrad);opacity:0;animation:haloIn 1s ease forwards}
@keyframes haloIn{to{opacity:1}}
.slabel{fill:var(--ink);font-family:var(--sans);text-anchor:middle;opacity:0;animation:tickIn .5s ease forwards;paint-order:stroke;stroke:rgba(3,6,15,.85)}
.slabel.gold{fill:var(--gold)}
.trail{fill:none;stroke:#cfe0ff;stroke-linecap:round}
.cloud{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(6px,-3px)}}
.cloud.clear{transition:opacity 1.4s ease;opacity:0!important}
.meteor{stroke:#fff;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:meteor .9s ease-out forwards}
@keyframes meteor{0%{stroke-dashoffset:1;opacity:0}20%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 14px;border-radius:20px;
  background:var(--panel);border:1px solid var(--panel-border);font-size:14px;color:var(--ink-soft);
  opacity:0;transition:opacity .3s ease;pointer-events:none;max-width:92%;text-align:center}
#toast.show{opacity:1}
#zoombar{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zbtn{font-size:22px;font-weight:600;background:var(--panel);border-color:var(--panel-border);color:var(--ink)}
.zbtn:disabled{opacity:.3}
#place{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--ink-faint);pointer-events:none;letter-spacing:.3px}

#instruction{font-size:clamp(16px,2.2vw,19px);line-height:1.5;margin:0;min-height:1.5em}
#instruction.success{font-family:var(--serif);color:var(--gold);font-size:clamp(19px,2.7vw,23px)}
#explain{font-size:15px;line-height:1.55;color:var(--ink-soft);margin:0}
#explain:empty,#hinttext:empty{display:none}
#hinttext{font-size:14px;color:#c9d6f5;margin:0;padding:6px 10px;border-right:2px solid var(--line);background:rgba(169,198,255,.06);border-radius:4px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#counter{font-size:14px;color:var(--ink-soft);margin-inline-end:auto}
button{font-family:var(--sans);font-size:15px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);

button:hover:not(:disabled){background:rgba(255,255,255,.1)}
button:disabled{opacity:.35;cursor:default}
button.primary{border-color:var(--gold);color:var(--gold)}
button.primary.ready{background:rgba(232,207,138,.12);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,207,138,.08)}}

#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,10,.6);z-index:10;padding:16px}
#overlay.show{display:flex;animation:fadeIn .4s ease}
.card{max-width:480px;width:100%;max-height:100%;overflow:auto;background:rgba(9,16,36,.96);border:1px solid var(--panel-border);border-radius:14px;

.lvbtn small{font-size:9.5px;letter-spacing:1px;color:var(--gold);height:11px;line-height:11px}
.lvbtn.cur{border-color:var(--gold)}
.chapdesc{font-size:13px;color:var(--ink-faint);margin:-4px 0 8px}
input{-webkit-user-select:text;user-select:text;font-family:var(--sans)}

GROUPS.umi={ name:"הדובה הקטנה", stars:GROUPS.little.stars, lines:GROUPS.little.lines };   /* the Little Dipper is the whole Little Bear: body (the bowl) and a long tail */
GROUPS.orionFull={ name:"אוריון", stars:[...GROUPS.orionMid.stars,...GROUPS.club.stars,...GROUPS.shield.stars], lines:[...GROUPS.orionMid.lines,...GROUPS.club.lines,...GROUPS.shield.lines] };
/* The shapes that lead to Polaris (the others are signposts for other directions) */
const POLE_GROUPS=["dipper","cas"];
/* Every star that belongs to a "teaching" shape — random field stars keep clear of them */
const KEY_STARS = [...new Set(Object.values(GROUPS).flatMap(g=>g.stars))];

/* How each shape leads to Polaris (real sky geometry):
   dipper — from Merak through Dubhe (the outer side of the bowl), about 5× their separation beyond Dubhe.
   cas    — from the middle star (Navi) through the middle of the W's opening, about 2 W-widths. */
const GUIDES = {
  dipper:{ anchor:"merak", ticks:P=>{const s=sub(P.dubhe,P.merak);return [1,2,3,4].map(i=>add(P.dubhe,mul(s,i)))}, tol:10 },
  cas:   { anchor:"navi",  ticks:P=>{const w=dist(P.caph,P.segin), d=norm(sub(P.polaris,P.navi));return [add(P.navi,mul(d,w))]}, tol:12 },
  /* Orion's north arrow — the middle belt star (Alnilam) and Orion's head (Meissa) share almost the same right ascension,
     so the line through them runs along a meridian of the sky, straight to the celestial pole (true path drawn as a curve). */
  orion: { anchor:"iotaOri", alt:"alnilam", ticks:()=>[], tol:13, curve:true, spotTol:.07 },
  /* the east side of the Great Square (Algenib -> Alpheratz) lies on the 0h meridian, which runs on through Caph of Cassiopeia to the pole */
  square:{ anchor:"algenib", alt:"alpheratz", ticks:()=>[], tol:12, curve:true, spotTol:.07 },
};

const PLACES = {
  tlv:   {name:"תל אביב",  lat:32.1},
  eilat: {name:"אילת",     lat:29.6},
  hermon:{name:"החרמון",   lat:33.3},
  ams:   {name:"אמסטרדם",  lat:52.4},
  reyk:  {name:"רייקיאוויק", lat:64.1},
  mumbai:{name:"מומבאי",   lat:19.1},
  sydney:{name:"סידני",    lat:-33.9},
};

/* =======================================================================
   PART 2 — MATH (vectors, real sky positions, camera projection)
   ======================================================================= */
const D2R=Math.PI/180;
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), mul=(a,k)=>({x:a.x*k,y:a.y*k});
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}), len=a=>Math.hypot(a.x,a.y), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=a=>{const l=len(a)||1;return {x:a.x/l,y:a.y/l}};
const angleBetween=(a,b)=>Math.abs(Math.atan2(a.x*b.y-a.y*b.x,a.x*b.x+a.y*b.y))/D2R;
function segDist(p,a,b){const ab=sub(b,a),t=Math.max(0,Math.min(1,((p.x-a.x)*ab.x+(p.y-a.y)*ab.y)/((ab.x*ab.x+ab.y*ab.y)||1)));return dist(p,add(a,mul(ab,t)))}
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const v3={ dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  scale:(a,k)=>[a[0]*k,a[1]*k,a[2]*k], add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]} };
function pointInPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];
  if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))c=!c}return c}
function circle3(a,b,c){const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y)); if(Math.abs(d)<1e-9) return null;
  const ux=((a.x*a.x+a.y*a.y)*(b.y-c.y)+(b.x*b.x+b.y*b.y)*(c.y-a.y)+(c.x*c.x+c.y*c.y)*(a.y-b.y))/d;
  const uy=((a.x*a.x+a.y*a.y)*(c.x-b.x)+(b.x*b.x+b.y*b.y)*(a.x-c.x)+(c.x*c.x+c.y*c.y)*(b.x-a.x))/d;
  return {c:{x:ux,y:uy}, r:Math.hypot(a.x-ux,a.y-uy)}}

/* Local horizon frame: x = East, y = North, z = Up (right-handed).
   Equatorial (RA, Dec) -> horizon vector for latitude `lat` and local sidereal time `lst` (hours). */
function horVec(ra,dec,lat,lst){
  const H=(lst*15-ra)*D2R, d=dec*D2R, f=lat*D2R;
  const alt=Math.asin(Math.sin(d)*Math.sin(f)+Math.cos(d)*Math.cos(f)*Math.cos(H));
  const az=Math.atan2(-Math.cos(d)*Math.sin(H), Math.sin(d)*Math.cos(f)-Math.cos(d)*Math.sin(f)*Math.cos(H));
  return [Math.cos(alt)*Math.sin(az), Math.cos(alt)*Math.cos(az), Math.sin(alt)];
}
const dirVec=(azDeg,altDeg)=>{const a=azDeg*D2R,h=altDeg*D2R;return [Math.cos(h)*Math.sin(a),Math.cos(h)*Math.cos(a),Math.sin(h)]};
/* Camera looking OUT from the centre of the sky sphere: forward f, screen-up u, screen-right r = f × u.
   This keeps the true (non-mirrored) handedness of every constellation. */
function makeCam(f,upHint,rollDeg=0){
  f=v3.norm(f); let u=v3.add(upHint, v3.scale(f,-v3.dot(upHint,f))); u=v3.norm(u);
  if(rollDeg){const a=rollDeg*D2R; u=v3.norm(v3.add(v3.scale(u,Math.cos(a)), v3.scale(v3.cross(f,u),Math.sin(a))));}
  return {f,u,r:v3.cross(f,u)};
}
/* Stereographic projection (angle-preserving → shapes stay true) */
function camProj(v,cam){const d=v3.dot(v,cam.f); if(d<-0.6) return null;
  return {x:2*v3.dot(v,cam.r)/(1+d), y:-2*v3.dot(v,cam.u)/(1+d)};}

/* =======================================================================
   PART 3 — VIEW BUILDER: a real sky for a place & time, plus obstacles
   spec fields (all optional):
     mode: "chart" | "horizon" | "dome"     place: key of PLACES
     rot (chart: degrees from the "classic" spring-evening Dipper) | lst (hours, number or [lo,hi]) | jitter
     yaw, alt0, roll (horizon camera)        domeRot (dome: where north points on screen, degrees)
     require: groups/stars that must be fully visible
     exclude: groups that must NOT be usable (off-screen, below horizon, or — with cloudExclude — behind clouds)
     mustSet: {group, min}  at least `min` of the group's stars below the horizon
     needNorth: keep the north point of the horizon in view
     fill: [lo,hi] how much of the screen the required stars span
     faint, medium, bright, brighter (#field stars brighter than Polaris), magLimit
     clouds: number of random clouds, cloudExclude, hidePolaris (a cloud hides Polaris)
     cloudHide: [star ids] each hidden behind its own cloud · lightHide: [star ids] invisible (lost in city light)
     faceAz: horizon view direction (0 N, 90 E, 180 S, 270 W) · skyOnly: horizon may fall below the screen
     placeFrom: [place keys] one is picked at random each time · hidePlace: do not show where you are
     moon, city, plane, scenery: "hills" | "trees" | "town"
   ======================================================================= */
function expandIds(list){const out=[];(list||[]).forEach(k=>{if(GROUPS[k])out.push(...GROUPS[k].stars);else out.push(k)});return out}

function chooseLst(spec){
  const j=spec.jitter??10;
  if (typeof spec.lst==="number") return spec.lst + rand(-j,j)/15;
  if (Array.isArray(spec.lst)) return rand(spec.lst[0],spec.lst[1]);
  if (spec.rot!=null) return 11 + spec.rot/15 + rand(-j,j)/15;   // LST 11h = Dipper high, bowl left, handle right
  return rand(0,24);
}

function buildView(spec, vbW, vbH){
  for (let attempt=0; attempt<500; attempt++){
    const relax = attempt>350;                    // never get stuck: relax the rarest constraints
    const v = tryBuildView(spec, vbW, vbH, attempt, relax);
    if (v) return v;
  }
  return tryBuildView(Object.assign({},spec,{exclude:[],mustSet:null,clouds:0,cloudExclude:false}), vbW, vbH, 0, true);
}

function tryBuildView(spec, vbW, vbH, attempt, relax){
  const mode=spec.mode||"chart", place=PLACES[spec.place||"tlv"], lat=place.lat;
  const lst=chooseLst(spec);
  const cloudHide=[...(spec.hidePolaris?["polaris"]:[]),...(spec.cloudHide||[])], hideIds=cloudHide.concat(spec.lightHide||[]);
  const unit=Math.min(vbW,vbH), margin=unit*0.085;
  const H={}; for(const id in CATALOG) H[id]=horVec(CATALOG[id].ra,CATALOG[id].dec,lat,lst);
  const altOf=id=>Math.asin(H[id][2])/D2R;
  const pole=dirVec(0,lat);

  // camera
  let cam;
  if (mode==="chart") cam=makeCam(pole,[0,0,1],0);
  else if (mode==="horizon"){
    if (spec.aim){ let c=[0,0,0]; expandIds(spec.require).forEach(id=>{c=v3.add(c,H[id])}); c=v3.norm(c);
      const yaw=Math.atan2(c[0],c[1])/D2R, alt=Math.min(78,Math.max(10,Math.asin(c[2])/D2R));
      cam=makeCam(dirVec(yaw,alt),[0,0,1], spec.roll??0);
    } else {
    const yaw=spec.yaw??((spec.faceAz||0)+rand(-12,12)), alt0=spec.alt0??(lat*rand(.5,.75));
    cam=makeCam(dirVec(yaw,alt0),[0,0,1], spec.roll??0); }
  } else cam=makeCam([0,0,1], dirVec(spec.domeRot??0,0), 0);

  const req=expandIds(spec.require);
  if (mode!=="chart" && req.some(id=>altOf(id)<(id==="polaris"?1:4))) return null;
  if (spec.mustSet && !relax){ const n=GROUPS[spec.mustSet.group].stars.filter(id=>altOf(id)<0).length; if(n<spec.mustSet.min) return null; }
  const PR={}; for(const id in CATALOG) PR[id]=camProj(H[id],cam);
  if (req.some(id=>!PR[id])) return null;

  // fit scale + offset
  let scale,ox,oy;
  if (mode==="dome"){ scale=(unit/2-unit*0.045)/2; ox=vbW/2; oy=vbH/2; }
  else{
    const pts=req.map(id=>PR[id]);
    if (mode==="horizon" && !spec.skyOnly && !spec.aim){ const n=camProj(dirVec(spec.faceAz||0,0),cam); if(!n) return null; pts.push(n);
      if (spec.needNorth) pts.push({x:n.x,y:n.y+0.03}); }
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const bx0=Math.min(...xs),bx1=Math.max(...xs),by0=Math.min(...ys),by1=Math.max(...ys);
    const bw=Math.max(bx1-bx0,1e-3), bh=Math.max(by1-by0,1e-3);
    const fill=rand(...(spec.fill||[0.6,0.75]))*(relax?0.85:1);
    scale=fill*Math.min((vbW-2*margin)/bw,(vbH-2*margin)/bh);
    ox=rand(margin,vbW-margin-bw*scale)-bx0*scale; oy=rand(margin,vbH-margin-bh*scale)-by0*scale;
  }
  const S=p=>p?{x:p.x*scale+ox,y:p.y*scale+oy}:null;
  const onScreen=(p,pad=0)=>p&&p.x>-pad&&p.x<vbW+pad&&p.y>-pad&&p.y<vbH+pad;
  const P={}; for(const id in CATALOG) P[id]=S(PR[id]);
  if (mode!=="chart") for(const id in CATALOG) if(!P[id]) P[id]={x:-9999,y:-9999};

  const view={placeKey:spec.place||"tlv",mode,spec,lat,lst,place,cam,scale,ox,oy,S,P,H,altOf,vbW,vbH,unit,stars:[],blockers:[],clouds:[],ground:null,dome:null};
  view.Ppole=S(camProj(pole,cam));
  view.N = mode==="chart"?null:S(camProj([0,1,0],cam));
  view.F = mode==="horizon"?S(camProj(dirVec(spec.faceAz||0,0),cam)):view.N;   // the horizon point we are facing
  view.faceAz = mode==="horizon" ? Math.atan2(cam.f[0],cam.f[1])/D2R : 0;
  if (mode==="horizon" && !spec.skyOnly && !spec.aim && (!view.F || !onScreen(view.F,-margin*0.3))) return null;

  // ground (horizon line is a great circle → a circle on the screen)
  if (mode==="horizon"){
    const yaw=Math.atan2(cam.f[0],cam.f[1])/D2R;
    const a=S(camProj(dirVec(yaw-50,0),cam)),b=S(camProj(dirVec(yaw,0),cam)),c=S(camProj(dirVec(yaw+50,0),cam));
    if(!a||!b||!c) return null;
    const circ=circle3(a,b,c); if(!circ) return null;
    const below=S(camProj(dirVec(yaw,-15),cam));
    const inside = below ? dist(below,circ.c)<circ.r : true;
    view.ground={c:circ.c,r:circ.r,inside};
    view.isGround=p=>(dist(p,circ.c)<circ.r)===inside;
  } else if (mode==="dome"){
    view.dome={c:{x:ox,y:oy},r:2*scale};
    view.isGround=p=>dist(p,view.dome.c)>view.dome.r;
  } else view.isGround=()=>false;

  // exclusions: the excluded shape must not be usable
  const usableCount=id=>onScreen(P[id],-4)&&(mode==="chart"||altOf(id)>0)&&!view.isGround(P[id]);
  const exc=spec.exclude||[];
  if (!relax && !spec.cloudExclude) for(const g of exc){ if (GROUPS[g].stars.filter(usableCount).length>1) return null; }

  // ---------- which real stars can be seen ----------
  let magLimit = spec.magLimit ?? 5.6;
  if (spec.city) magLimit=Math.min(magLimit,3.7);
  if (spec.moon) magLimit=Math.min(magLimit,4.4);
  const mustSee=[...new Set(req.concat(["polaris"]).filter(id=>usableCount(id)&&!hideIds.includes(id)))];
  const mustPts=mustSee.map(id=>P[id]);
  if (hideIds.some(id=>!usableCount(id))) return null;
  view.cloudHide=cloudHide;

  // scenery on the horizon (trees, hills, houses) — never over the stars you need
  if (mode==="horizon" && spec.scenery) buildScenery(view, spec.scenery, mustPts);
  if (mode==="dome") buildDomeTrees(view, mustPts);

  // clouds
  if (!buildClouds(view, spec, mustPts, exc)) return null;

  // moon
  if (spec.moon){
    let ok=false;
    for(let t=0;t<80&&!ok;t++){
      const p={x:rand(unit*.1,vbW-unit*.1),y:rand(unit*.1,vbH-unit*.1)};
      if ([[0,0],[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>view.isGround({x:p.x+a*unit*.035,y:p.y+b*unit*.035}))||view.blockers.some(poly=>pointInPoly(p,poly))||mustPts.some(m=>dist(m,p)<unit*0.22)||inCloud(view,p,1.2)) continue;
      view.moon={x:p.x,y:p.y,phase:rand(.15,.6)*(Math.random()<.5?-1:1)}; ok=true;
    }
  }

  const hiddenAt=p=>view.isGround(p)||view.blockers.some(poly=>pointInPoly(p,poly))||inCloud(view,p,0.92)
                     ||(view.moon&&dist(p,view.moon)<unit*0.11);
  for(const id in CATALOG){
    const p=P[id]; if(!onScreen(p,20)) continue;
    if (mode!=="chart" && altOf(id)<0) continue;
    if (hideIds.includes(id)){ view.stars.push({id,key:id,x:p.x,y:p.y,mag:CATALOG[id].mag,hit:false,hidden:true}); continue; }
    const isMust=mustSee.includes(id);
    if (!isMust && CATALOG[id].mag>magLimit) continue;
    const hidden=!isMust && hiddenAt(p);
    if (hidden) continue;
    view.stars.push({id,key:id,x:p.x,y:p.y,mag:CATALOG[id].mag,hit:!CATALOG[id].noHit});
  }
  // the required stars must really be there
  for(const id of mustSee){ if(!view.stars.find(s=>s.key===id&&!s.hidden)) return null; }
  // "find Polaris yourself" puzzles: at least one guiding shape must be fully usable
  if (spec.anyGuide && !relax){
    const full=g=>GROUPS[g].stars.every(id=>view.stars.some(s=>s.key===id&&!s.hidden));
    if(!full("dipper")&&!full("cas")) return null;
  }

  // ---------- random field stars ----------
  const keyPts=KEY_STARS.map(id=>P[id]).filter(p=>onScreen(p,30));
  const segs=Object.values(GROUPS).flatMap(g=>g.lines.map(([a,b])=>[P[a],P[b]])).filter(([a,b])=>a&&b&&(onScreen(a,200)||onScreen(b,200)));
  const dens=Math.min(1.25,(vbW*vbH)/(1000*640)) * (mode==="dome"?0.8:1);
  function scatter(n,magLo,magHi,keyClear,segClear){
    let placed=0,tries=0;
    while(placed<n && tries<n*50){
      tries++;
      const p={x:rand(6,vbW-6),y:rand(6,vbH-6)};
      if (hiddenAt(p)) continue;
      if (view.ground && Math.abs(dist(p,view.ground.c)-view.ground.r)<unit*0.05 && Math.random()<0.6) continue; // haze near horizon
      if (keyPts.some(k=>dist(k,p)<keyClear)) continue;
      if (segClear && segs.some(([a,b])=>segDist(p,a,b)<segClear)) continue;
      if (view.stars.some(s=>dist(s,p)<(segClear?unit*0.045:4))) continue;
      const mag=rand(magLo,magHi); if (mag>magLimit) { placed++; continue; }
      view.stars.push({id:"f"+view.stars.length,x:p.x,y:p.y,mag,hit:true}); placed++;
    }
  }
  scatter(Math.round((spec.faint??80)*dens),4.4,5.7,unit*0.035,0);
  scatter(Math.round((spec.medium??12)*dens),3.2,4.3,unit*0.05,unit*0.03);
  scatter(spec.bright??0,2.4,3.1,unit*0.09,unit*0.06);
  const brighterVisible=view.stars.filter(s=>!s.hidden&&s.mag<CATALOG.polaris.mag&&!["polaris"].includes(s.key)).length;
  if ((spec.brighter??0)>brighterVisible) scatter(spec.brighter-brighterVisible,0.9,1.8,unit*0.14,unit*0.09);

  // rotation sense of the sky (for the "turning sky" levels) — real diurnal motion
  if (mode==="chart"){
    const a=S(camProj(horVec(CATALOG.dubhe.ra,CATALOG.dubhe.dec,lat,lst),cam)), b=S(camProj(horVec(CATALOG.dubhe.ra,CATALOG.dubhe.dec,lat,lst+0.2),cam));
    const ra=sub(a,view.Ppole), rb=sub(b,view.Ppole); view.spinSign=Math.sign(ra.x*rb.y-ra.y*rb.x)||-1;
  }
  return view;
}

function inCloud(view,p,k){ return view.clouds.some(cl=>cl.ell.some(e=>{const dx=(p.x-e.x)/(e.rx*k),dy=(p.y-e.y)/(e.ry*k);return dx*dx+dy*dy<1})) }

function makeCluster(cx,cy,R){
  const n=randi(3,6), ell=[];
  for(let i=0;i<n;i++){ const a=rand(0,6.283),o=R*rand(0,.55); ell.push({x:cx+Math.cos(a)*o*1.4,y:cy+Math.sin(a)*o*.6,rx:R*rand(.55,1),ry:R*rand(.32,.55)}); }
  ell.push({x:cx,y:cy,rx:R*.75,ry:R*.45});
  return {ell};
}
function buildClouds(view, spec, mustPts, exc){
  const unit=view.unit, clearOf=(cl,k=1.3)=>!mustPts.some(m=>cl.ell.some(e=>{const dx=(m.x-e.x)/(e.rx*k),dy=(m.y-e.y)/(e.ry*k);return dx*dx+dy*dy<1}));
  for(const hid of view.cloudHide||[]){
    let ok=false; const hp=view.P[hid];
    // the cloud is sized to the gap around the hidden star, so it never covers the stars you need
    const gap=Math.min(unit*.26,...mustPts.map(m=>dist(m,hp)).filter(d=>d>0.5));
    for(let t=0;t<40&&!ok;t++){ const R=Math.max(unit*.018,Math.min(unit*rand(.08,.11),gap/2.5)*Math.pow(.93,t)); const cl=makeCluster(hp.x+rand(-.25,.25)*R,hp.y+rand(-.15,.15)*R,R);
      cl.cover=hid; if(clearOf(cl) && inCloud({clouds:[cl]},hp,0.7)){ view.clouds.push(cl); ok=true; } }
    if(!ok) return false;
  }
  if (spec.cloudExclude){
    for(const g of exc) for(const id of GROUPS[g].stars){
      const p=view.P[id]; if(p.x<-30||p.x>view.vbW+30||p.y<-30||p.y>view.vbH+30) continue;
      let ok=false;
      for(let t=0;t<30&&!ok;t++){ const R=unit*rand(.07,.1); const cl=makeCluster(p.x+rand(-.2,.2)*R,p.y+rand(-.1,.1)*R,R);
        if(clearOf(cl) && inCloud({clouds:[cl]},p,0.75)){ view.clouds.push(cl); ok=true; } }
      if(!ok) return false;
    }
  }
  for(let i=0;i<(spec.clouds||0);i++){
    for(let t=0;t<60;t++){ const R=unit*rand(.08,.16); const cl=makeCluster(rand(0,view.vbW),rand(0,view.vbH),R);
      if(clearOf(cl,1.45)){ view.clouds.push(cl); break; } }
  }
  return true;
}

/* Trees / hills / houses standing on the horizon circle */
function buildScenery(view, kind, mustPts){
  const g=view.ground, unit=view.unit, k=unit/700;
  const angAt=p=>Math.atan2(p.y-g.c.y,p.x-g.c.x);
  // visible part of the horizon: sample angles, keep the on-screen ones
  const samples=[]; for(let i=0;i<720;i++){ const a=i/720*2*Math.PI, q={x:g.c.x+g.r*Math.cos(a),y:g.c.y+g.r*Math.sin(a)};
    if(q.x>-40&&q.x<view.vbW+40&&q.y>-40&&q.y<view.vbH+40) samples.push(a); }
  if(!samples.length) return;
  const outward=a=>{const n={x:Math.cos(a),y:Math.sin(a)};return g.inside?n:mul(n,-1)};

function audioInit(){

    Snd.fx=c.createGain(); Snd.fx.gain.value=Save.sfx?1:0; Snd.fx.connect(Snd.master);
    const fxv=c.createGain(); fxv.gain.value=.35; Snd.fx.connect(fxv); fxv.connect(Snd.verb);

}
function tone(freq,t,dur,{type="sine",vol=.2,attack=.008,dest,detune=0}={}){

function bell(freq,t,vol,dest){ tone(freq,t,1.8,{vol,dest}); tone(freq*2.01,t,.9,{vol:vol*.25,dest}); tone(freq*3.98,t,.35,{vol:vol*.08,dest}); }
/* the n-th star of a shape (out of total): pentatonic steps for small shapes, finer steps for big ones — always rising, up to two octaves */
function tickNote(n,total){ const PENT=[0,2,4,7,9];
  if(!total||total<=11) return 62+Math.min(36,Math.floor(n/5)*12+PENT[n%5]);
  return 62+n*24/(total-1); }
function sfx(name,n=0,total=0){
  if(!Save.sfx) return; audioInit(); const c=Snd.ctx; if(!c) return; const t=c.currentTime+.01;
  switch(name){
    case "tick": bell(midi(tickNote(n,total)),t,.15); break;
    case "stage": bell(midi(74),t,.15); bell(midi(81),t+.11,.15); break;
    case "win": [74,78,81,86].forEach((m,i)=>bell(midi(m),t+i*.09,.15)); tone(midi(62),t,2.2,{type:"triangle",vol:.05,attack:.05}); break;
    case "finale": [62,66,69,74,78,81,86,90].forEach((m,i)=>bell(midi(m),t+i*.12,.13));
      [50,57,62,66].forEach(m=>tone(midi(m),t+.2,3.5,{type:"triangle",vol:.04,attack:.4})); break;
    case "wrong": { const o=tone(190,t,.28,{type:"triangle",vol:.12}); o.frequency.exponentialRampToValueAtTime(120,t+.25); break; }
    case "hint": bell(midi(76),t,.1); bell(midi(69),t+.16,.1); break;
    case "spin": for(let i=0;i<7;i++) bell(midi(SCALE[(i*3)%SCALE.length]+12),t+i*.55,.06); break;

/* --- background music: short pieces with a real tune, then a rest of silence ---

const MODES=[
  {name:"major",  s:[0,2,4,5,7,9,11], progs:[[0,4,5,3],[0,3,4,0],[0,5,3,4],[3,4,0,0],[0,2,3,4]]},
  {name:"minor",  s:[0,2,3,5,7,8,10], progs:[[0,5,2,6],[0,3,4,0],[0,6,5,6],[0,5,6,4]]},
  {name:"dorian", s:[0,2,3,5,7,9,10], progs:[[0,3,0,3],[0,6,3,0],[0,1,0,6]]},
  {name:"mixo",   s:[0,2,4,5,7,9,10], progs:[[0,6,3,0],[0,3,6,0]]},

const scaleNote=(song,deg,oct)=>{ const s=song.mode.s, d=((deg%7)+7)%7, o=Math.floor(deg/7); return song.root+oct*12+o*12+s[d]; };

function makeMotif(){ // 16 eighth-steps: which steps play, and a melodic contour in scale degrees

  r.forEach((st,i)=>{ if(i) d+=pick([-2,-1,-1,1,1,2,0,3,-3]); d=Math.max(0,Math.min(11,d)); notes.push({st,d,len:(r[i+1]??16)-st}); });

  const prevMode=Snd.lastMode;

function musicApply(){

  if (V.mode==="horizon"){ const g=V.ground, circ=`M${g.c.x-g.r},${g.c.y}a${g.r},${g.r} 0 1,0 ${2*g.r},0a${g.r},${g.r} 0 1,0 ${-2*g.r},0Z`;
    const d=g.inside?circ:`M${-big},${-big}H${big}V${big}H${-big}Z`+circ;
    el("path",{d,fill:"#04060b","fill-rule":"evenodd"},G);
    el("path",{d:circ,fill:"none",stroke:"rgba(169,198,255,.12)","stroke-width":1.2*k},G);
  }
  if (V.mode==="dome"){ const g=V.dome, circ=`M${g.c.x-g.r},${g.c.y}a${g.r},${g.r} 0 1,0 ${2*g.r},0a${g.r},${g.r} 0 1,0 ${-2*g.r},0Z`;
    el("path",{d:`M${-big},${-big}H${big}V${big}H${-big}Z`+circ,fill:"#04060b","fill-rule":"evenodd"},G);
    el("path",{d:circ,fill:"none",stroke:"rgba(169,198,255,.22)","stroke-width":1.2*k},G);
  }

  if (V.spec.city && V.mode==="horizon"){ // a few lit windows
    V.blockers.slice(1).forEach(poly=>{ if(Math.random()<.5){ const c=poly.reduce((a,p)=>add(a,mul(p,1/poly.length)),{x:0,y:0});
      el("rect",{x:c.x-1.5*k,y:c.y-1.5*k,width:3*k,height:3*k,fill:"#e8b86a",opacity:.75},G);} });
  }
}

function drawPath(layer,a,b,cls,widthPx,delay){const k=pxk();
  const p=el("path",{d:`M${a.x},${a.y}L${b.x},${b.y}`,pathLength:1,class:cls,"stroke-width":widthPx*k},$(layer)); if(delay)p.style.animationDelay=delay+"s"; return p;}
function drawPoly(layer,pts,cls,widthPx){const k=pxk();return el("path",{d:"M"+pts.map(p=>p.x+","+p.y).join("L"),pathLength:1,class:cls,"stroke-width":widthPx*k},$(layer));}
function drawGroupLines(g,cls="cline draw",layer="layer-lines",stagger=0.12){
  GROUPS[g].lines.forEach(([a,b],i)=>{const n=drawPath(layer,State.view.P[a],State.view.P[b],cls,1.4,i*stagger);n.setAttribute("data-g",g)});}
function ringStar(id){const k=pxk(),p=State.view.P[id];el("circle",{cx:p.x,cy:p.y,r:11*k,class:"ring","stroke-width":1.3*k},$("layer-marks"))}
function haloAt(p){const k=pxk();el("circle",{cx:p.x,cy:p.y,r:34*k,class:"halo"},$("layer-fx-back"));el("circle",{cx:p.x,cy:p.y,r:13*k,class:"ring","stroke-width":1.6*k},$("layer-marks"))}
function label(p,text,o={}){const k=pxk(),V=State.view;

  t.setAttribute("x",Math.max(60*k,Math.min(V.vbW-60*k,p.x))); t.setAttribute("y",Math.max(22*k,Math.min(V.vbH-8*k,p.y+(o.dy??-18)*k))); return t;}
function groupLabel(g){const pts=GROUPS[g].stars.map(id=>State.view.P[id]);const cx=pts.reduce((a,p)=>a+p.x,0)/pts.length,maxY=Math.max(...pts.map(p=>p.y));

function wrongMarkAt(p,node){sfx("wrong");const k=pxk(),d=4*k,cx=p.x+9*k,cy=p.y-9*k;
  const g=el("path",{class:"xmark","stroke-width":1.6*k,d:`M${cx-d},${cy-d}L${cx+d},${cy+d}M${cx+d},${cy-d}L${cx-d},${cy+d}`},$("layer-fx"));

function visibleGroups(){ const V=State.view;
  return POLE_GROUPS.filter(g=>GROUPS[g].stars.every(id=>V.stars.some(s=>s.key===id&&!s.hidden))); }
function viaGroups(via){ if(via==="both") return ["dipper","cas"]; if(via==="auto"||via==="spin") return visibleGroups(); return [via]; }
/* The guide from a shape to Polaris: a straight line, or (curve:true) the real meridian of the sky from the anchor star to the pole */
function guidePts(via){ const V=State.view, G=GUIDES[via]; if(!G) return [];
  if(!G.curve) return [V.P[G.anchor],V.P.polaris];
  return meridianPts(G.anchor,CATALOG.polaris.dec); }
/* points along the anchor star's right ascension, from the star toward the north celestial pole; stops at decTo or at the horizon */
function meridianPts(id,decTo=90){ const V=State.view, c=CATALOG[id], pts=[], dir=decTo>=c.dec?1:-1, step=0.5*dir;
  let prev=null;
  for(let d=c.dec; dir>0?d<=decTo+1e-6:d>=decTo-1e-6; d+=step){ const h=horVec(c.ra,d,V.lat,V.lst);
    if(V.mode!=="chart" && h[2]<0){ if(prev){ const p=V.S(camProj(h,V.cam)),q=V.S(camProj(prev,V.cam)); if(p&&q){const f=prev[2]/(prev[2]-h[2]);pts.push(add(q,mul(sub(p,q),f)));} } break; }
    const p=V.S(camProj(h,V.cam)); if(p) pts.push(p); prev=h; }
  if(dir>0 && decTo>=CATALOG.polaris.dec-0.01 && pts.length && V.P.polaris.x>-999 && V.altOf("polaris")>0) pts.push(V.P.polaris);
  return pts; }
function showGuide(via,ticks=true){ const V=State.view, P=V.P, G=GUIDES[via]; if(!G) return;
  drawPoly("layer-fx-back",guidePts(via),"guide draw",1.4);
  if(ticks){const k=pxk();G.ticks(P).forEach((p,i)=>{const c=el("circle",{cx:p.x,cy:p.y,r:2.3*k,class:"tick"},$("layer-fx"));c.style.animationDelay=(.3+i*.18)+"s"})} }
function groupRegion(ids){const pts=ids.map(id=>State.view.P[id]);const c=pts.reduce((a,p)=>add(a,mul(p,1/pts.length)),{x:0,y:0});return {c,r:Math.max(...pts.map(p=>dist(p,c)))}}
function showRegion(c,r){clearRegions();el("circle",{cx:c.x,cy:c.y,r,class:"region","stroke-width":1.2*pxk(),"data-region":1},$("layer-fx-back"))}
function clearRegions(){document.querySelectorAll("[data-region]").forEach(n=>n.remove())}
function regionNear(p){const V=State.view,r=V.unit*.11+30*pxk(),a=rand(0,6.28),o=r*rand(.25,.5);showRegion({x:p.x+Math.cos(a)*o,y:p.y+Math.sin(a)*o},r)}
function flashLines(groups,guides){const V=State.view,nodes=[];
  groups.forEach(g=>GROUPS[g].lines.forEach(([a,b])=>nodes.push(drawPath("layer-fx-back",V.P[a],V.P[b],"hintline",1.4))));
  (guides||[]).forEach(v=>{if(GUIDES[v])nodes.push(drawPoly("layer-fx-back",guidePts(v),"hintline",1.1))});
  setTimeout(()=>nodes.forEach(n=>n.remove()),2300)}
function northLine(){ // the vertical circle from Polaris straight down to the north point of the horizon
  const V=State.view; if(V.mode==="dome") return [V.P.polaris,V.N];
  const pts=[]; const top=V.altOf("polaris"); for(let a=top;a>=0;a-=Math.max(1,top/30)) pts.push(V.S(camProj(dirVec(0,a),V.cam))); pts.push(V.N); return pts.filter(Boolean);
}

/* Point on the horizon at azimuth az (degrees) */

/* The real path of a star across the sky, from now until it meets the horizon (sign -1: back to its rising) */
function starPath(id,sign){ const V=State.view, c=CATALOG[id], pts=[];

    if(h[2]<0){ const p=V.S(camProj(h,V.cam)), q=pts[pts.length-1]; if(p&&q){ // cut the last step exactly at the horizon

function dirGuide(s){ const V=State.view;

  $("tlBack").onclick=showAdmin; if(ed) $("sdCancel").onclick=()=>showSchedule();
  document.querySelectorAll("[data-sed]").forEach(b=>b.onclick=()=>showSchedule(+b.dataset.sed));
  document.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>delTwice(b,()=>publishCodes(CODES,$("sdMsg"),b,"schedule",SCHEDULE.filter((_,j)=>j!==+b.dataset.sdel))));
  if(keys.length) $("sdAdd").onclick=()=>{
    const chosen=[...document.querySelectorAll("[data-sk]")].filter(cb=>cb.checked).map(cb=>cb.dataset.sk);
    const v=$("sdAt").value, at=v?new Date(v).getTime():NaN, msg=$("sdMsg");
    if(!chosen.length){ msg.textContent="בחר לפחות פרק אחד."; return; }
    if(!isFinite(at)){ msg.textContent="בחר תאריך ושעה."; return; }
    if(at<=Date.now()+30000){ msg.textContent="בחר זמן בעתיד. כדי לפתוח פרק עכשיו, סמן אותו במסך הניהול."; return; }
    // one time per chapter: the edited entry goes away, and a chapter that already had a time gets the new one
    const sched=SCHEDULE.filter((e,j)=>j!==editIdx && !chosen.includes(e.key)).concat(chosen.map(key=>({key,at})));
    publishCodes(CODES,msg,$("sdAdd"),"schedule",sched); };
}

function showCodes(editIdx=null){
  if(!Admin.on) return;
  const mine=Save.myCodes||{}, ed=editIdx!=null?CODES[editIdx]:null, all=!!(ed&&ed.ch.includes("*"));
  const keys=CHAPTERS.filter(c=>!BaseOpen.has(c.key)||(ed&&ed.ch.includes(c.key))).map(c=>[c.key,c.title]).concat(BaseOpen.has("endless")&&!(ed&&ed.ch.includes("endless"))?[]:[["endless","מסע אינסופי"]]);
  let html=toolBar("קודי גישה")+`<p>קוד פותח פרקים נעולים רק למי שמקליד אותו, במכשיר שבו הקליד. שלח את הקוד לאנשים שתבחר. השחקן מקליד אותו בכפתור "יש לי קוד" שבמפה.</p>`;
  html+=`<h3>${ed?"עריכת קוד":"קוד חדש"}</h3>${ed&&mine[ed.h]?`<p style="margin:-4px 0 10px">הקוד עצמו לא משתנה: <span class="codeval">${esc(mine[ed.h])}</span></p>`:ed?`<p class="chapdesc">הקוד עצמו לא משתנה.</p>`:""}
    <label class="chapdesc" for="cdName" style="display:block;margin:0 0 4px">למי הקוד? (השם גלוי לכל מי שמסתכל בקוד המקור של הדף, לכן בלי פרטים אישיים)</label>
    <input id="cdName" class="txtin" maxlength="40" placeholder="למשל: קבוצת הבודקים" value="${ed?esc(ed.name||""):""}">
    <div class="chapdesc" style="margin:12px 0 2px">אילו פרקים הקוד פותח?</div>
    <label class="chk"><input type="checkbox" id="cdAll" ${all?"checked":""}> <b style="color:var(--ink);font-weight:600">כל הפרקים הנעולים, והמסע האינסופי</b></label>
    <div class="chkgrid" id="cdList">${keys.map(([k,t])=>chkRow("data-ch",k,t,ed&&!all&&ed.ch.includes(k))).join("")}</div>
    <label class="chk"><input type="checkbox" id="cdFree" ${ed&&ed.free?"checked":""}> לפתוח מיד את כל הרמות בפרקים האלה (בלי לסיים קודם את הקודמות)</label>
    <p id="cdMsg" class="chapdesc" style="margin-top:10px"></p>
    <div class="btns" style="justify-content:flex-start"><button class="primary ready" id="cdMake">${ed?"שמור שינויים":"צור קוד ושמור"}</button>${ed?`<button id="cdCancel" class="small">ביטול עריכה</button>`:""}</div>`;
  html+=`<h3>הקודים שלך</h3>`+(CODES.length ? CODES.map((e,i)=>`<div class="coderow"${i===editIdx?' style="background:rgba(232,207,138,.06)"':""}><div class="info"><b>${esc(e.name||"קוד ללא שם")}</b><span>${esc(codeSummary(e))}${e.free?" · כל הרמות פתוחות מיד":""}</span></div>
      ${mine[e.h]?`<span class="codeval">${esc(mine[e.h])}</span><button class="small" data-copy="${esc(mine[e.h])}">העתק</button>`:`<span class="chapdesc" style="margin:0">הקוד נשמר רק במכשיר שבו נוצר</span>`}
      <button class="small" data-ced="${i}">ערוך</button><button class="small" data-del="${i}">מחק</button></div>`).join("")
    : `<p class="chapdesc">עדיין אין קודים.</p>`);
  showCard(html,true);
  $("tlBack").onclick=showAdmin; if(ed) $("cdCancel").onclick=()=>showCodes();
  const syncAll=()=>document.querySelectorAll("[data-ch]").forEach(cb=>{ if($("cdAll").checked) cb.checked=true; cb.disabled=$("cdAll").checked; });
  $("cdAll").onchange=syncAll; if(all) syncAll();
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ const t=b.dataset.copy;
    navigator.clipboard.writeText(t).then(()=>toast("הקוד הועתק")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(b.previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("הקוד מסומן — העתק אותו"); }); });
  document.querySelectorAll("[data-ced]").forEach(b=>b.onclick=()=>showCodes(+b.dataset.ced));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delTwice(b,()=>publishCodes(CODES.filter((_,j)=>j!==+b.dataset.del),$("cdMsg"),b,"codes")));
  $("cdMake").onclick=async()=>{
    const isAll=$("cdAll").checked, ch=isAll?["*"]:[...document.querySelectorAll("[data-ch]")].filter(cb=>cb.checked).map(cb=>cb.dataset.ch);
    if(!ch.length){ $("cdMsg").textContent="בחר לפחות פרק אחד שהקוד יפתח."; return; }
    const fields={name:$("cdName").value.trim().slice(0,40),ch,free:$("cdFree").checked};
    if(ed){ publishCodes(CODES.map((e,j)=>j===editIdx?Object.assign({},e,fields):e),$("cdMsg"),$("cdMake"),"codes"); return; }
    $("cdMake").disabled=true; $("cdMsg").textContent="יוצר קוד…";
    const code=newCode(), salt=randHex(8);
    const entry=Object.assign({h:randHex(8),p:salt+"$"+await strongHash(code,salt)},fields);   // h is only an id now
    Save.myCodes=Object.assign({},Save.myCodes,{[entry.h]:code});    // the readable code stays only on the manager's device
    publishCodes([...CODES,entry],$("cdMsg"),$("cdMake"),"codes"); };
}
(async()=>{ try{
  /* the site's admin sees every chapter (also locked ones) and a button to the admin page */
  let flag=null; try{ flag=localStorage.getItem("ofek-admin-device"); }catch(e){}
  if(flag!=="1") return;
  const me=await fetch("/api/admin/me",{cache:"no-store",credentials:"same-origin"}).then(r=>r.json());
  if(!me||!me.admin) return;
  Admin.on=true; $("btnAdmin").hidden=false; updateHeader();
}catch(e){} })();
/* =======================================================================
   BOOT
   ======================================================================= */
/* run fn once the first sky and the start card are up (the manager panel may be detected before or after that) */
let booted=false; const bootQueue=[]; function afterBoot(fn){ if(booted) fn(); else bootQueue.push(fn); }
codesReady.then(()=>requestAnimationFrame(()=>{ State.kind="level"; State.levelIdx=firstOpenLevel(); startPuzzle(levelPuzzle(State.levelIdx)); showStart();
  let toMap=null; try{ toMap=sessionStorage.getItem("ofek-open-map"); sessionStorage.removeItem("ofek-open-map"); }catch(x){} if(toMap) showMap();
  booted=true; bootQueue.splice(0).forEach(f=>f()); }));
if(SCHEDULE.length){ setInterval(()=>applySchedule(true),30000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) applySchedule(true); }); }
})(); /*WRAP_END*/
</script>

</body></html>
